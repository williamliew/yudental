<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Yu Dental Laboratory</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="Yu Dental Laboratory home">
        <img src="yu-dental.png" alt="Yu Dental Laboratory" width="160" height="56">
      </a>
      <button type="button" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="main-nav">
        <span></span><span></span><span></span>
      </button>
      <nav id="main-nav" class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="team.html">Our Team</a>
        <a href="contact.html" class="current">Contact Us</a>
        <a href="book.html" class="nav-cta">Book Online</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <h1>Contact Us</h1>
    </section>

    <section class="contact">
      <div class="contact-block">
        <div class="contact-details">
          <h3>Our Address</h3>
          <p>12 College Street<br>Te Aro, Wellington</p>
          <p><strong>Tel:</strong> 04-388 7491</p>
        </div>
        <div class="contact-details">
          <h3>Opening Hours</h3>
          <p>Monday – Friday 8.30am – 5pm</p>
          <p>Saturday Closed</p>
          <p>Sunday Closed</p>
        </div>
      </div>
      <div class="map-wrap">
        <!-- Replace src with embed code from Google Maps (Search 12 College St, Te Aro, Wellington → Share → Embed map). -->
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3192.272909999754!2d174.776!3d-41.292!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDHCsDE3JzMxLjIiUyAxNzTCsDQ2JzMzLjYiRQ!5e0!3m2!1sen!2snz!4v1"
          width="100%"
          height="320"
          style="border:0;"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Yu Dental Laboratory location map">
        </iframe>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; Yu Dental Laboratory. All rights reserved.</p>
  </footer>
  <script>
    (function() {
      var btn = document.querySelector('.nav-toggle');
      var nav = document.getElementById('main-nav');
      if (!btn || !nav) return;
      btn.addEventListener('click', function() {
        var open = document.body.classList.toggle('nav-open');
        btn.setAttribute('aria-expanded', open);
      });
      nav.addEventListener('click', function(e) {
        if (e.target.closest('a')) {
          document.body.classList.remove('nav-open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    })();
  </script>
</body>
</html>
